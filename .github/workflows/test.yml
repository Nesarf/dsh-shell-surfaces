name: test

# The self-test is pure: it reads the surface table and the argv builder and
# asserts the shape of both, so it needs no host, no DSH, and no dependency
# install (this package has none). It runs on Linux on purpose -- the surfaces it
# drives are Windows-only, and a Linux runner is where "the checks are portable"
# stops being a claim and becomes a job result.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: self-test on node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: report which surfaces this runner can see
        run: node scripts/which-surfaces.mjs
      - name: self-test
        run: node test/surfaces-test.mjs
