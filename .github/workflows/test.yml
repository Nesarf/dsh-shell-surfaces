name: test

# Two jobs, because they answer different questions.
#
# `self-test` is pure: it asserts the surface table and the argv shape, so it
# needs no host, no DSH, and no install (this package has no dependencies). It runs
# on Linux on purpose -- the surfaces it drives are Windows-only, so a Linux
# runner is where "the checks are portable" stops being a claim.
#
# `surfaces` runs the real probe on both platforms and asks every shell it can
# find what version it is. On Windows that is twelve surfaces and six terminals;
# on Linux it is the POSIX ones, because the script is platform-shaped, and a
# Windows-only list would answer a Linux runner with twelve "not found" lines --
# which reads as a broken script instead of an honest report. The tables land in
# the run summary, so "which surfaces exist" becomes a record with history rather
# than something a person measured once.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: self-test on node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: report which surfaces this runner can see
        run: node scripts/which-surfaces.mjs
      - name: self-test
        run: node test/surfaces-test.mjs

  surfaces:
    name: surfaces on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: ask every shell on this runner what it is
        shell: pwsh
        run: |
          ./scripts/probe-all-shells.ps1 | Out-File -Encoding utf8 probe.json
          node scripts/probe-table.mjs probe.json
      - name: run one real command on every surface that exists here
        shell: pwsh
        run: node scripts/live-check.mjs
