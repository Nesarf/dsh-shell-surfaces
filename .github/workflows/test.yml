name: test

# Two jobs, because they answer different questions.
#
# `self-test` is pure: it asserts the surface table and the argv shape, so it
# needs no host, no DSH, and no install (this package has no dependencies). It runs
# on Linux on purpose -- the surfaces it drives are Windows-only, so a Linux
# runner is where "the checks are portable" stops being a claim.
#
# `surfaces` runs two probes on both platforms, because they answer different
# questions and neither covers the other.
#
#   probe-faces.mjs       reads the surface TABLE, so it covers every face the
#                         plugin can run here -- interpreters, the shells inside a
#                         distribution, the window hosts -- and a face added to the
#                         table shows up without being added here too.
#   probe-all-shells.ps1  reads versions of the terminals and the long-standing
#                         shells from a hand-written list; it is platform-shaped,
#                         so a Linux runner gets the POSIX ones rather than twelve
#                         "not found" lines.
#
# The tables land in the run summary, so "which surfaces exist" becomes a record
# with history rather than something a person measured once.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: self-test on node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: report which surfaces this runner can see
        run: node scripts/which-surfaces.mjs
      - name: install the declared dev dependency (the sandbox seam)
        run: npm install --no-audit --no-fund
      - name: self-test
        run: node test/surfaces-test.mjs

  surfaces:
    name: surfaces on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: ask every surface in the table what it is (one run, two readers)
        shell: pwsh
        run: |
          $env:LIVE_CHECK_JSON = '1'
          node scripts/live-check.mjs > live.json
          node scripts/probe-table.mjs live.json
      - name: ask the terminals and the long-standing shells what they are
        shell: pwsh
        run: |
          ./scripts/probe-all-shells.ps1 | Out-File -Encoding utf8 probe.json
          node scripts/probe-table.mjs probe.json
